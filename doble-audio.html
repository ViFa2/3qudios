<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Doble Audio</title>
<style>
  :root {
    --bg: #f3f1f7; --surface: #ffffff; --fg: #1d1a24; --muted: #6b6578;
    --twitch: #7c4dda; --yt: #d93b3b; --line: #e2dde9;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121016; --surface: #1c1922; --fg: #ece8f3; --muted: #9a93a8; --line: #2c2834; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 var(--font);
    padding: env(safe-area-inset-top, 0px) max(12px, env(safe-area-inset-right, 0px)) 24px max(12px, env(safe-area-inset-left, 0px));
  }
  h1 { font-size: 20px; margin: 14px 0 4px; }
  p.sub { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 10px; margin-bottom: 12px; }
  .row { display: flex; gap: 8px; }
  .row input { flex: 1; min-width: 0; }
  label { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  label.tw { color: var(--twitch); } label.yt { color: var(--yt); }
  input { font: inherit; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
  button { font: inherit; font-weight: 600; padding: 9px 14px; border: 0; border-radius: 8px; color: #fff; cursor: pointer; }
  button.tw { background: var(--twitch); } button.yt { background: var(--yt); }
  .player { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 10px; overflow: hidden; }
  .player > div, .player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .empty { display: grid; place-items: center; color: #8a8494; font-size: 13px; }
</style>
</head>
<body>
  <h1>Doble Audio</h1>
  <p class="sub">Stream de Twitch y música de YouTube en la misma página. Dale play a los dos.</p>

  <section class="panel">
    <label class="tw" for="tw-in">Canal de Twitch</label>
    <div class="row">
      <input id="tw-in" placeholder="ej. ibai" autocapitalize="off" autocorrect="off">
      <button class="tw" id="tw-btn">Cargar</button>
    </div>
    <div class="player" id="tw-box"><div class="empty">Sin stream cargado</div></div>
  </section>

  <section class="panel">
    <label class="yt" for="yt-in">Enlace de YouTube</label>
    <div class="row">
      <input id="yt-in" placeholder="https://youtu.be/..." autocapitalize="off" autocorrect="off">
      <button class="yt" id="yt-btn">Cargar</button>
    </div>
    <div class="player" id="yt-box"><div class="empty">Sin video cargado</div></div>
  </section>

<script src="https://player.twitch.tv/js/embed/v1.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const save = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  const load = k => { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } };

  function loadTwitch() {
    const ch = $("tw-in").value.trim().replace(/^.*twitch\.tv\//, "").split(/[/?]/)[0];
    if (!ch) return;
    save("tw", ch);
    $("tw-box").innerHTML = '<div id="tw-player"></div>';
    new Twitch.Player("tw-player", {
      channel: ch, width: "100%", height: "100%",
      parent: [location.hostname], muted: false, autoplay: false
    });
  }

  function ytId(url) {
    const m = url.match(/(?:youtu\.be\/|v=|\/embed\/|\/shorts\/|\/live\/)([\w-]{11})/);
    if (m) return { type: "v", id: m[1] };
    const l = url.match(/list=([\w-]+)/);
    if (l) return { type: "list", id: l[1] };
    return null;
  }

  function loadYouTube() {
    const r = ytId($("yt-in").value.trim());
    if (!r) { $("yt-box").innerHTML = '<div class="empty">No reconozco ese enlace</div>'; return; }
    save("yt", $("yt-in").value.trim());
    const src = r.type === "v"
      ? `https://www.youtube.com/embed/${r.id}?playsinline=1`
      : `https://www.youtube.com/embed/videoseries?list=${r.id}&playsinline=1`;
    $("yt-box").innerHTML = `<iframe src="${src}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
  }

  $("tw-btn").onclick = loadTwitch;
  $("yt-btn").onclick = loadYouTube;
  $("tw-in").onkeydown = e => { if (e.key === "Enter") loadTwitch(); };
  $("yt-in").onkeydown = e => { if (e.key === "Enter") loadYouTube(); };

  $("tw-in").value = load("tw");
  $("yt-in").value = load("yt");
</script>
</body>
</html>
